<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .Title }}{{ .Title }} | {{ end }}{{ .Site.Title }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
</head>
<body>
<header class="site-header">
  <div class="container">
    <a href="{{ "/" | relURL }}" class="logo">{{ .Site.Title }}</a>
    <nav>
      {{ range .Site.Menus.main }}
        <a href="{{ .URL }}" {{ if .Params.external }}target="_blank" rel="noopener"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
<main class="container">
  {{ block "main" . }}{{ end }}
</main>
<footer class="site-footer">
  <div class="container">
    <p>© {{ now.Year }} {{ .Site.Title }} · Xây bởi Hermes AI · <a href="https://speedreading.vn/pshermes" target="_blank" rel="noopener">Học khoá Hermes</a></p>
  </div>
</footer>
</body>
</html>
